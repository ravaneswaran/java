<div class="right-container">
    <!--<div th:replace="~{fragments/common/stock_group_tip_container}"></div>-->
    <div class="right-container-stock-listing-container">
        <div class="right-container-company-frame-div-0" th:each="trigger : ${webpage.triggers}">
            <div class="right-container-company-div">
                <div class="right-container-company-title-container">
                    <div class="right-container-company-title-div" th:text="${trigger.name}"></div>
                    <div class="right-container-company-stock-market-chart-div">
                        <img src="/images/icons/stock-market-chart.png" class="right-container-company-stock-market-chart-img"/>
                    </div>
                </div>
                <!--width: 100%; height: 70%;-->
                <div>
                    <div th:id="${trigger.id}" class="right-container-company-table-div">
                        <table>
                            <tbody>
                            <tr>
                                <td class="td-left">Group</td>
                                <td class="td-right" th:text="${trigger.group}"></td>
                            </tr>
                            <tr>
                                <td class="td-left">Job Name</td>
                                <td class="td-right" th:text="${trigger.jobName}"></td>
                            </tr>
                            <tr>
                                <td class="td-left">Job Group</td>
                                <td class="td-right" th:text="${trigger.jobGroup}"></td>
                            </tr>
                            <tr>
                                <td class="td-left">Prev Fire Time</td>
                                <td class="td-right" th:text="${trigger.previousFireTime}"></td>
                            </tr>
                            <tr>
                                <td class="td-left">Next Fire Time</td>
                                <td class="td-right" th:text="${trigger.nextFireTime}"></td>
                            </tr>
                            <tr>
                                <td class="td-left">Priority</td>
                                <td class="td-right" th:text="${trigger.priority}"></td>
                            </tr>
                            <tr>
                                <td class="td-left">Trigger State</td>
                                <td class="td-right" th:text="${trigger.triggerState}"></td>
                            </tr>
                            <tr>
                                <td class="td-left">Trigger Type</td>
                                <td class="td-right" th:text="${trigger.triggerType}"></td>
                            </tr>
                            <tr>
                                <td class="td-left">Start Time</td>
                                <td class="td-right" th:text="${trigger.startTime}"></td>
                            </tr>
                            <tr>
                                <td class="td-left">End Time</td>
                                <td class="td-right" th:text="${trigger.endTime}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <!--<div th:id="${stock.stockStatDivId}" class="right-container-company-table-div" style="height:0%; width:0%;">
                        this is the div
                    </div>-->
                </div>
                <div class="right-container-company-trading-stats-div">
                    Trading Statistics
                </div>
            </div>
        </div>
    </div>
</div>
<script>
  // Refresh page after 1 minute (1 × 60 × 1000 ms)
  setTimeout(function() {
    location.reload();
  }, 1 * 60 * 1000);
</script>
