<div class="right-container">
    <div class="right-container-stock-listing-container">
        <div class="right-container-company-frame-div-0 right-container-company-frame-div-0-job-admin-ext" th:each="job : ${webpage.jobDetailModels}">
            <div class="right-container-company-div">
                <div class="right-container-company-title-container">
                    <div class="right-container-company-title-div" th:text="${job.name}"></div>
                </div>
                <div>
                    <div th:id="${job.id}" class="right-container-company-table-div">
                        <table>
                            <tbody>
                            <tr>
                                <td class="td-left td-left-job-admin-ext">Group</td>
                                <td class="td-right td-right-job-admin-ext" th:text="${job.group}"></td>
                            </tr>
                            <tr>
                                <td class="td-left td-left-job-admin-ext">Scheduler Name</td>
                                <td class="td-right td-right-job-admin-ext" th:text="${job.schedulerName}"></td>
                            </tr>
                            <tr>
                                <td class="td-left td-left-job-admin-ext">Is Durable</td>
                                <td class="td-right td-right-job-admin-ext" th:text="${job.isDurable}"></td>
                            </tr>
                            <tr>
                                <td class="td-left td-left-job-admin-ext">Is NonConcurrent</td>
                                <td class="td-right td-right-job-admin-ext" th:text="${job.isNonConcurrent}"></td>
                            </tr>
                            <tr>
                                <td class="td-left td-left-job-admin-ext">Is UpdateData</td>
                                <td class="td-right td-right-job-admin-ext" th:text="${job.isUpdateData}"></td>
                            </tr>
                            <tr>
                                <td class="td-left td-left-job-admin-ext">Request Recovery</td>
                                <td class="td-right td-right-job-admin-ext" th:text="${job.requestRecovery}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="right-container-company-trading-stats-div">
                    Controls...
                </div>
            </div>
        </div>
    </div>
</div>
