<div class="right-container">
    <div th:replace="~{fragments/common/stock_group_tip_container}"></div>
    <div class="right-container-stock-listing-container">
        <div class="right-container-company-frame-div-0" th:each="stock : ${webpage.nsePreOpenMarketModels}">
            <div class="right-container-company-div">
                <div class="right-container-company-title-container">
                    <div class="right-container-company-title-div" th:text="${stock.symbol}"></div>
                    <div class="right-container-company-stock-market-chart-div">
                        <img src="/sm-static-hub/images/icons/stock-market-chart.png" class="right-container-company-stock-market-chart-img"/>
                    </div>
                </div>
                <!--width: 100%; height: 70%;-->
                <div>
                    <div th:id="${stock.stockDivId}" class="right-container-company-table-div">
                        <table>
                            <tbody>
                            <tr>
                                <td class="td-left">Bussi Date</td>
                                <td class="td-right" th:text="${stock.businessDate}"></td>
                            </tr>
                            <tr>
                                <td class="td-left">Previous Cls</td>
                                <td class="td-right" th:text="${stock.previousClose}"></td><td class="td-left">Previous Cls</td>
                                <td class="td-right" th:text="${stock.previousClose}"></td>
                            </tr>
                            <tr>
                                <td class="td-left">IndEquiPrice</td>
                                <td class="td-right" th:text="${stock.indicativeEquilibriumPrice}"></td>
                            </tr>
                            <tr>
                                <td class="td-left">Price Change</td>
                                <td class="td-right" th:text="${stock.priceChange}"></td>
                            </tr>
                            <tr>
                                <td class="td-left">Price % Chg</td>
                                <td class="td-right" th:text="${stock.pricePercentageChange}"></td>
                            </tr>
                            <tr>
                                <td class="td-left">Final Price</td>
                                <td class="td-right" th:text="${stock.finalPrice}"></td>
                            </tr>
                            <tr>
                                <td class="td-left">52 Week High</td>
                                <td class="td-right" th:text="${stock.newMarket52WeekHigh}"></td>
                            </tr>
                            <tr>
                                <td class="td-left">52 Week Low</td>
                                <td class="td-right" th:text="${stock.newMarket52WeekLow}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <!--<div th:id="${stock.stockStatDivId}" class="right-container-company-table-div" style="height:0%; width:0%;">
                        this is the div
                    </div>-->
                </div>
                <div class="right-container-company-trading-stats-div">
                    Trading Statistics
                </div>
            </div>
        </div>
    </div>
</div>
