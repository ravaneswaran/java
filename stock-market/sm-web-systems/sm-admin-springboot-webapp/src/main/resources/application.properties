#-----------------------------#
# Server port settings        #
#-----------------------------#
server.port=8080

#----------------------------#
# Spring datasource settings #
#----------------------------#
spring.datasource.url=jdbc:mysql://localhost:3306/stock_market?useSSL=false&serverTimezone=UTC
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#---------------------#
# Spring JPA settings #
#---------------------#
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=create
spring.mvc.throw-exception-if-no-handler-found=true

#------------------------------#
# HikariCP specific properties #
#------------------------------#
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000

#------------------------------#
#        Context Path          #
#------------------------------#
server.servlet.context-path=/sm-admin

#----------------------------------------------#
#        Enable Logging Shutdown Hook          #
#----------------------------------------------#
logging.shutdown-hook.enabled=true
